<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="hd-grad-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="hd-grad-light-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="hd-text-desk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <g transform="translate(5, 0) scale(0.9)">
    <path d="M10 78 C10 75 14 74 18 74 L102 74 C106 74 110 75 110 78 C110 82 104 84 98 84 L22 84 C16 84 10 82 10 78 Z" fill="url(#hd-grad)" />
  <path d="M50 74 L70 74 C70 76 68 77 66 77 L54 77 C52 77 50 76 50 74 Z" fill="#0f172a" opacity="0.6" />

  <!-- Laptop Screen Outer Frame -->
  <rect x="16" y="16" width="88" height="56" rx="8" stroke="url(#hd-grad)" stroke-width="4.5" fill="none" />

  <!-- Person Silhouette -->
  <circle cx="60" cy="46" r="7" fill="url(#hd-grad)" />
  <path d="M47 62 C47 54 53 52 60 52 C67 52 73 54 73 62 Z" fill="url(#hd-grad)" />

  <!-- Network Nodes & Connecting Lines -->
  <!-- Top central node above head -->
  <circle cx="60" cy="28" r="3.5" fill="url(#hd-grad-light)" />
  <line x1="60" y1="28" x2="60" y2="39" stroke="url(#hd-grad-light)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left node -->
  <circle cx="37" cy="35" r="3.5" fill="url(#hd-grad-light)" />
  <line x1="37" y1="35" x2="60" y2="28" stroke="url(#hd-grad-light)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="37" y1="35" x2="28" y2="47" stroke="url(#hd-grad-light)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="28" cy="47" r="3.5" fill="url(#hd-grad-light)" />

  <!-- Right node -->
  <circle cx="83" cy="35" r="3.5" fill="url(#hd-grad-light)" />
  <line x1="83" y1="35" x2="60" y2="28" stroke="url(#hd-grad-light)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Checkmark Badge on Bottom Right Screen -->
  <path d="M78 52 L83 57 L93 47" stroke="url(#hd-grad-light)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  </g>

  <!-- Text: HireDesk -->
  <text x="130" y="58" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.5px">
    <tspan fill="#F8FAFC">Hire</tspan>
    <tspan fill="url(#hd-text-desk)" font-weight="700">Desk</tspan>
  </text>
</svg>