<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none">
  <defs>
    <linearGradient id="hd-lockup-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0A3" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#99771A" />
    </linearGradient>
    <linearGradient id="hd-lockup-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="50%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- HD Monogram Symbol (Left) -->
  <g transform="translate(6, 6)">
    <!-- Base container -->
    <rect width="64" height="64" rx="14" fill="#1B1B1B" />
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="url(#hd-lockup-gold)" stroke-width="1.25" stroke-opacity="0.4" />

    <!-- H Left Stem -->
    <rect x="15" y="15" width="5" height="34" rx="2.5" fill="url(#hd-lockup-gold)" />

    <!-- H Crossbar -->
    <rect x="15" y="30" width="18" height="4.5" rx="2" fill="url(#hd-lockup-gold)" />

    <!-- D Curve -->
    <path d="M31 15 H39.5 C48 15 54 22 54 32 C54 42 48 49 39.5 49 H31" stroke="url(#hd-lockup-gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- AI Node Core -->
    <circle cx="34" cy="32" r="3" fill="url(#hd-lockup-spark)" />
    
    <!-- Neural Branches -->
    <line x1="34" y1="32" x2="42" y2="25" stroke="url(#hd-lockup-gold)" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="34" y1="32" x2="44" y2="38" stroke="url(#hd-lockup-gold)" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.85" />
    
    <!-- Neural Sub-Nodes -->
    <circle cx="42" cy="25" r="2.2" fill="url(#hd-lockup-spark)" />
    <circle cx="44" cy="38" r="2.2" fill="url(#hd-lockup-spark)" />

    <!-- Diamond Precision Flare -->
    <path d="M34 27 L35 31.5 L39.5 32 L35 32.5 L34 37 L33 32.5 L28.5 32 L33 31.5 Z" fill="url(#hd-lockup-spark)" opacity="0.9" />
  </g>

  <!-- Typography Wordmark (Right) -->
  <g transform="translate(86, 12)">
    <!-- Main "HireDesk" Brand Name -->
    <text x="0" y="36" font-family="'Fraunces', 'Inter', system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.02em">
      <tspan fill="#F5E6C8">Hire</tspan>
      <tspan fill="url(#hd-lockup-gold)" font-weight="700">Desk</tspan>
    </text>

    <!-- Subscript Tagline -->
    <text x="2" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#D4AF37" letter-spacing="0.22em" opacity="0.9">
      PRECISION AI RECRUITMENT
    </text>
  </g>
</svg>