<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hd-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0A3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#99771A" />
    </linearGradient>
    <linearGradient id="hd-gold-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="50%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <radialGradient id="hd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="100" height="100" rx="20" fill="#171717" />
  <rect x="1" y="1" width="98" height="98" rx="19" stroke="url(#hd-gold)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Subtle Ambient Glow Behind Node -->
  <circle cx="56" cy="50" r="18" fill="url(#hd-glow)" />

  <!-- Geometric Monogram "H" Stem -->
  <!-- Left Vertical Stem of H -->
  <rect x="24" y="24" width="7" height="52" rx="3.5" fill="url(#hd-gold)" />

  <!-- Horizontal Crossbar of H -->
  <rect x="24" y="47" width="28" height="6.5" rx="3" fill="url(#hd-gold)" />

  <!-- Monogram "D" - Spine & Dynamic Curve -->
  <path d="M49 24 H62 C74.5 24 83 34.5 83 50 C83 65.5 74.5 76 62 76 H49" stroke="url(#hd-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- AI Intelligence Core Node & Constellation Lines -->
  <!-- Central Spark Node -->
  <circle cx="53" cy="50" r="4.5" fill="url(#hd-gold-spark)" />
  
  <!-- Neural Branch Lines -->
  <line x1="53" y1="50" x2="65" y2="40" stroke="url(#hd-gold)" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85" />
  <line x1="53" y1="50" x2="68" y2="58" stroke="url(#hd-gold)" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85" />
  <line x1="65" y1="40" x2="72" y2="42" stroke="url(#hd-gold)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Connected Sub-Nodes -->
  <circle cx="65" cy="40" r="3.2" fill="url(#hd-gold-spark)" />
  <circle cx="68" cy="58" r="3.2" fill="url(#hd-gold-spark)" />
  <circle cx="72" cy="42" r="2.2" fill="url(#hd-gold-spark)" />

  <!-- Diamond Precision Flare -->
  <path d="M53 43 L54.5 49 L60.5 50 L54.5 51 L53 57 L51.5 51 L45.5 50 L51.5 49 Z" fill="url(#hd-gold-spark)" opacity="0.9" />
</svg>